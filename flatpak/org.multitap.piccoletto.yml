# piccoletto as a Flatpak (Linux desktop). Built by .github/workflows/flatpak.yml;
# locally:
#   flatpak-builder --user --install --force-clean build-flatpak flatpak/org.multitap.piccoletto.yml
# The sources are this checkout, with its submodules already in deps/
# (git submodule update --init --recursive).
#
# Inside the sandbox piccoletto's folder (settings) is
# ~/.var/app/org.multitap.piccoletto/data/piccoletto, not ~/.local/share/piccoletto.
# No icon yet (the logo is to come).
app-id: org.multitap.piccoletto
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: piccoletto
finish-args:
  - --share=ipc
  - --share=network         # talking to piccolo on the local network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all            # GPU and game controllers

modules:
  - name: piccoletto
    buildsystem: simple
    build-commands:
      # MULTITAP_PICCOLETTO_DIR empty: don't copy the build to ~/.local/share.
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMULTITAP_PICCOLETTO_DIR= -DMULTITAP_BUILD_TESTS=OFF
      - cmake --build build --target piccoletto
      - install -Dm755 build/piccoletto /app/bin/piccoletto
      - install -Dm644 assets/linux/org.multitap.piccoletto.desktop /app/share/applications/org.multitap.piccoletto.desktop
      - install -Dm644 assets/linux/org.multitap.piccoletto.metainfo.xml /app/share/metainfo/org.multitap.piccoletto.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-asan
          - build-flatpak
          - .flatpak-builder
          - android/build
