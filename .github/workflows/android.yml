# Builds piccoletto's Android APKs with android/build-apk.sh, the same script
# as on the development machine, and uploads them as artifacts:
#   piccoletto.apk          arm64-v8a, Vulkan (OpenGL ES 3 fallback)
#   piccoletto-legacy.apk   armeabi-v7a, Android 5+, OpenGL ES 2 only
#                           (build-apk.sh --legacy)
# Install one with:
#   adb install --no-incremental -r piccoletto.apk
# Signed with the release key from the repository secrets
# ANDROID_KEYSTORE_BASE64 (the PKCS12 keystore, base64) and
# ANDROID_KEYSTORE_PASS, key alias piccoletto. Where the secrets aren't
# available (pull requests from forks) it's signed with a debug key made for
# that run: installing over a build signed by the other key needs an
# uninstall first.
#
# main and v* tags: release.yml calls this workflow (workflow_call), to sign
# what it builds (a snapshot or a release).
#
# librashader (shaders) goes in too: android/build-librashader.sh with
# rustup's aarch64-linux-android target and the NDK's clang, cached by the
# submodule's commit (a cold build takes several minutes).
#
# The development machine (Linux arm64) uses the distro's clang with the
# NDK's sysroot; on GitHub's x86_64 runners the NDK's own clang does the same
# job (MULTITAP_LLVM_ROOT). The SDK's build tools (aapt2, d8, zipalign,
# apksigner) come with the runner.
name: Android

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  NDK_VERSION: r30
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  android:
    name: Android (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-v8a
            flags: ''
            apk: piccoletto.apk
            artifact: piccoletto-android-arm64
          - name: armeabi-v7a, legacy
            flags: --legacy
            apk: piccoletto-legacy.apk
            artifact: piccoletto-android-armv7-legacy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A build of main is a snapshot the releases server signs (release.yml):
      # its version says so (tools/snapshot-suffix.sh, read by hosts-common's
      # multitap_version).
      - name: Snapshot version
        if: github.workflow == 'Release' && github.ref_type == 'branch'
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"   # the Flatpak job's container
          tools/snapshot-suffix.sh | tee .multitap-version-suffix

      # r30: its libc++ has std::from_chars for double (frontends-common's
      # settings); the NDK the runner comes with may be older.
      - name: Cache the NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Download the NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"

      - name: SDK platform, build tools, Ninja
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build

      - name: librashader's commit
        id: librashader
        run: echo "commit=$(git rev-parse HEAD:deps/librashader)" >> "$GITHUB_OUTPUT"

      - name: Cache librashader
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            android/build/librashader/target
          key: librashader-android-${{ steps.librashader.outputs.commit }}-${{ env.NDK_VERSION }}

      - name: Build librashader
        run: |
          rustup target add aarch64-linux-android
          ndk="$HOME/android-ndk-${NDK_VERSION}"
          ANDROID_NDK_ROOT="$ndk" MULTITAP_LLVM_ROOT="$ndk/toolchains/llvm/prebuilt/linux-x86_64" \
            CARGO="$(command -v cargo)" android/build-librashader.sh

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PICCOLETTO_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export PICCOLETTO_KEYSTORE="$RUNNER_TEMP/release.p12"
            export PICCOLETTO_KEY_ALIAS=piccoletto
          fi
          ndk="$HOME/android-ndk-${NDK_VERSION}"
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          export PATH="$tools:$PATH"
          export ANDROID_NDK_ROOT="$ndk"
          export MULTITAP_LLVM_ROOT="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-${ANDROID_API}/android.jar"
          export AAPT_ANDROID_JAR="$ANDROID_JAR"
          export D8_JAR="$tools/lib/d8.jar"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export BUILD_TYPE=Release
          android/build-apk.sh ${{ matrix.flags }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android/build/${{ matrix.apk }}
