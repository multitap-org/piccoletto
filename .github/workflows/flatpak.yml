# Builds piccoletto's Flatpak (flatpak/site.multitap.piccoletto.yml) for x86_64
# and aarch64, and uploads each .flatpak bundle as an artifact. Install one with:
#   flatpak install --user piccoletto-<arch>.flatpak
# The same steps as piccolo's workflow.
# main and v* tags: release.yml calls this workflow (workflow_call), to sign
# what it builds (a snapshot or a release).
name: Flatpak

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # A build of main is a snapshot the releases server signs (release.yml):
      # its version says so (tools/snapshot-suffix.sh, read by hosts-common's
      # multitap_version).
      - name: Snapshot version
        if: github.workflow == 'Release' && github.ref_type == 'branch'
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"   # the Flatpak job's container
          tools/snapshot-suffix.sh | tee .multitap-version-suffix

      - name: Submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive --depth 1

      # The image comes with the SDK installed, and flatpak-builder updates it.
      # On the x86_64 runners that update fails with "Invalid cross-device
      # link": Docker's overlayfs can't rename folders that are in the image's
      # layers. A copy of the install folder is in the container's own layer,
      # where renaming works.
      - name: Make the installed runtimes updatable
        run: |
          for dir in /var/lib/flatpak "$HOME/.local/share/flatpak"; do
            if [ -d "$dir" ]; then
              cp -a "$dir" "$dir.copy"
              rm -rf "$dir"
              mv "$dir.copy" "$dir"
            fi
          done

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: piccoletto-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/site.multitap.piccoletto.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
